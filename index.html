 <article class="reportCard"><h3>Répartition par catégorie</h3>${metricHtml(categories,categoryColor)}</article>
 <article class="reportCard"><h3>Répartition par statut</h3>${metricHtml(statuses,()=> '#64748b')}</article>
 <article class="reportCard"><h3>Répartition par type</h3>${metricHtml(types,typeColor)}</article>
 <article class="reportCard"><h3>Charge par owner</h3>${metricHtml(owners,()=> '#334155')}</article>
 <article class="reportCard wide"><div class="sectionTitle"><div><h3>Top campagnes</h3><p>Classement priorisé par SQL, puis par taux de réponse.</p></div></div>${top.length?`<table class="reportTable"><thead><tr><th>Campagne</th><th>Catégorie</th><th>Type</th><th>Réponse</th><th>SQL</th><th>Statut</th></tr></thead><tbody>${top.map(r=>`<tr><td><b>${esc(r.campaign)}</b></td><td><span class="pill categoryPill ${categoryClass(r.category)}">${esc(r.category)}</span></td><td><span class="miniPill" style="background:${typeColor(r.type)};color:#fff">${esc(r.type)}</span></td><td>${num(r.responseRate)===null?'—':esc(r.responseRate)+' %'}</td><td class="scoreUp">${num(r.sqlGenerated)===null?'—':esc(r.sqlGenerated)}</td><td><span class="pill status-${normalizeStatus(r.status)}">${statusLabel(r.status)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="emptyState">Ajoute des taux de réponse ou des SQL pour afficher le classement.</div>'}</article>
 <article class="reportCard"><div class="sectionTitle"><div><h3>Alertes et actions</h3><p>Points à traiter en priorité.</p></div></div>${alerts.length?`<div class="alertList">${alerts.slice(0,8).map(a=>`<div class="alertItem"><span class="alertDot alert-${a[0]}"></span><div><b>${esc(a[1])}</b><div class="alertMeta">${esc(a[2])}</div></div><span class="mutedNote">${esc(a[3])}</span></div>`).join('')}</div>`:'<div class="emptyState">Aucune alerte sur le périmètre filtré.</div>'}</article>
 <article class="reportCard"><div class="sectionTitle"><div><h3>Performance par owner</h3><p>Charge active et contribution SQL.</p></div></div>${ownerData.length?`<table class="reportTable"><thead><tr><th>Owner</th><th>Total</th><th>Actives</th><th>SQL</th></tr></thead><tbody>${ownerData.map(([o,v])=>`<tr><td><span class="ownerBadge">${esc(o)}</span></td><td>${v.campaigns}</td><td>${v.active}</td><td class="scoreUp">${v.sql}</td></tr>`).join('')}</tbody></table>`:'<div class="emptyState">Aucun owner renseigné.</div>'}</article>`
}init();
</script></body></html>
